<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profitable Progress</title>
<style>
:root{--bg:#fff;--card:#f4f4f2;--text:#111;--muted:#666;--line:#ddd;--gold:#c9a227;--up:#1a9e5c;--down:#d6453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#141414;--text:#f5f5f5;--muted:#999;--line:#2a2a2a;--gold:#d4af37;--up:#2fc07a;--down:#ec5a52}}
:root[data-theme="dark"]{--bg:#000;--card:#141414;--text:#f5f5f5;--muted:#999;--line:#2a2a2a;--gold:#d4af37;--up:#2fc07a;--down:#ec5a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:430px;margin:0 auto;padding:12px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f1d77a,var(--gold));color:#000;font-weight:800;display:grid;place-items:center}
h2{margin:6px 0 10px;font-size:21px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;align-items:center;gap:12px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--gold);display:grid;place-items:center;flex:none;font-size:14px;color:#000}
.on .chk{background:var(--gold)}.on .nm{text-decoration:line-through;color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--gold);color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}
.btn.o{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.up{background:var(--up)}.btn.dn{background:var(--down)}
.btn:disabled{opacity:.4;cursor:default}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.muted{color:var(--muted);font-size:14px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 12px;margin:0 6px 6px 0;font-size:14px;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;align-items:flex-end;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;width:76px}
nav button span{font-size:22px}nav button.act{color:var(--gold)}
nav .cam span{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#000;display:grid;place-items:center;margin-top:-30px;border:4px solid var(--bg);font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.vf{height:190px;border-radius:16px;background:#0a0a0a;position:relative;overflow:hidden;margin-bottom:10px}
.vf::after{content:"";position:absolute;left:10%;right:10%;height:2px;background:var(--gold);animation:sc 2s linear infinite alternate}
@keyframes sc{from{top:20%}to{top:80%}}
@media (prefers-reduced-motion:reduce){.vf::after{animation:none;top:50%}}
.vf b{position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
.vf b:nth-child(1){top:14px;left:14px;border-right:0;border-bottom:0}.vf b:nth-child(2){top:14px;right:14px;border-left:0;border-bottom:0}
.vf b:nth-child(3){bottom:14px;left:14px;border-right:0;border-top:0}.vf b:nth-child(4){bottom:14px;right:14px;border-left:0;border-top:0}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:8px}
ul{padding-left:20px;margin:8px 0}li{margin-bottom:6px}
svg{width:100%;height:auto;display:block}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.wk button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wk button.sel{border-color:var(--gold);color:var(--gold);font-weight:700}
.wk i{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.wk i[hidden]{display:block;visibility:hidden}
.ex{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ex input{margin:0;width:auto;min-width:0;flex:2}.ex input+input{flex:1}
.x{background:none;border:0;color:var(--down);font-size:20px;padding:4px 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{background:none;border:0;border-radius:9px;padding:8px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.sel{background:var(--gold);color:#000}
.cb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.cb button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px}.cb button.sel{border-color:var(--gold);color:var(--gold);font-weight:700}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}.g4 input{margin:0;padding:10px 8px}
</style></head>
<body>
<div id="app">
<div class="top"><div class="logo">P</div>Profitable Progress</div>
<main id="screen"></main>
</div>
<nav>
<button data-t="fit" onclick="go('fit')"><span>💪</span>Fitness</button>
<button data-t="cam" class="cam" onclick="go('cam')"><span>📷</span>Camera</button>
<button data-t="psy" onclick="go('psy')"><span>🧘</span>Psyche</button>
</nav>
<script>
const $=q=>document.querySelector(q);
const S={tab:'fit',view:null,sel:(new Date().getDay()+6)%7,edit:0,rt:"07:00",note:"",cn:0,fs:"w",pm:"",goal:"lean",eq:["bw","db"],dpw:"4",log:[],lm:"",gw:"",sw:"",ps:0,am:"",pm:"",at:"06:30",bt:"22:00",aon:1,bon:1,fv:[],rot:0,lq:"",lc:"st",an:"",dt:"",pd:{},p:{age:"",ft:"",inch:"",lb:"",sex:"M",act:"1.375"},sc:null,food:"",wk:"",fc:"All"};
const DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const R=[{name:"Push day",ex:[{n:"Bench Press",s:"4 × 8"},{n:"Incline Dumbbell Press",s:"3 × 10"},{n:"Overhead Press",s:"3 × 8"},{n:"Triceps Pushdown",s:"3 × 12"}]},null,{name:"Pull day",ex:[{n:"Pull-ups",s:"4 × 8"},{n:"Barbell Row",s:"3 × 10"},{n:"Biceps Curl",s:"3 × 12"}]},null,{name:"Leg day",ex:[{n:"Squat",s:"4 × 6"},{n:"Romanian Deadlift",s:"3 × 8"},{n:"Calf Raise",s:"4 × 15"}]},null,null];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const F={'Apple':95,'Banana':105,'Egg':78,'Chicken breast (100 g)':165,'White rice (1 cup)':205,'Oatmeal (1 cup)':154,'Pizza slice':285,'Avocado':240,'Brown rice (1 cup)':215,'Pasta, cooked (1 cup)':220,'Bread slice, white':75,'Bread slice, whole wheat':80,'Bagel':280,'Flour tortilla':140,'Cereal (1 cup)':150,'Pancakes (2 medium)':190,'Waffle':220,'Quinoa, cooked (1 cup)':222,'Granola bar':120,'Orange':62,'Strawberries (1 cup)':50,'Blueberries (1 cup)':85,'Grapes (1 cup)':100,'Watermelon (1 cup)':46,'Pineapple (1 cup)':82,'Mango (1 cup)':100,'Peach':60,'Pear':100,'Raisins (1/4 cup)':130,'Broccoli (1 cup)':55,'Carrots (1 cup)':50,'Spinach, raw (1 cup)':7,'Sweet potato':112,'Baked potato':160,'Corn on the cob':90,'Green beans (1 cup)':31,'Side salad, no dressing':30,'Egg whites (3)':51,'Chicken thigh (100 g)':209,'Ground beef 85% (100 g)':215,'Sirloin steak (100 g)':206,'Salmon (100 g)':208,'Tuna, canned (1 can)':120,'Shrimp (100 g)':99,'Pork chop (100 g)':231,'Bacon (2 slices)':90,'Turkey deli meat (3 oz)':90,'Tofu (100 g)':76,'Protein shake (1 scoop)':120,'Greek yogurt, plain (1 cup)':130,'Flavored yogurt (1 cup)':150,'Milk, whole (1 cup)':150,'Milk, 2% (1 cup)':120,'Chocolate milk (1 cup)':190,'Cheddar cheese (1 slice)':113,'Mozzarella (1 oz)':85,'Cottage cheese (1/2 cup)':90,'Butter (1 tbsp)':102,'Ice cream (1/2 cup)':140,'Cheeseburger':300,'Hamburger':250,'French fries (medium)':365,'Chicken nuggets (6)':280,'Hot dog with bun':290,'Chicken burrito':500,'Taco':170,'Sub sandwich (6 in)':400,'Peanut butter and jelly sandwich':380,'Grilled cheese sandwich':400,'Mac and cheese (1 cup)':310,'Fried chicken (1 piece)':320,'Sushi roll (6 pieces)':250,'Ramen, instant (1 pack)':380,'Lasagna (1 slice)':330,'Potato chips (1 oz)':150,'Popcorn, air-popped (3 cups)':90,'Peanut butter (2 tbsp)':190,'Almonds (1 oz)':165,'Peanuts (1 oz)':165,'Trail mix (1/4 cup)':175,'Cookie':150,'Brownie':240,'Donut':250,'Chocolate bar':230,'Crackers (5)':80,'Pretzels (1 oz)':110,'Hummus (2 tbsp)':70,'Water':0,'Black coffee':2,'Latte (12 oz)':150,'Orange juice (1 cup)':110,'Soda (12 oz)':140,'Beer (12 oz)':150,'Wine (5 oz)':125,'Energy drink (16 oz)':200,'Sports drink (20 oz)':130,'Smoothie (16 oz)':250,'Olive oil (1 tbsp)':120,'Mayonnaise (1 tbsp)':94,'Ketchup (1 tbsp)':20,'Honey (1 tbsp)':64,'Sugar (1 tsp)':16,'Jelly (1 tbsp)':50,'Ranch dressing (2 tbsp)':130,'Maple syrup (2 tbsp)':110};
window.go=t=>{S.tab=t;S.view=null;S.dt='';draw();scrollTo(0,0)};
function draw(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("act",b.dataset.t===S.tab));
 ({fit,cam,psy:psyT}[S.tab])();save()}
function wk(){
 const td=(new Date().getDay()+6)%7,tw=R[td],w=tw?tw.ex.filter(x=>x.d).length:0,tot=tw?tw.ex.length:0,r=R[S.sel],E=S.edit;
 const days=DN.filter((d,i)=>R[i]).join(", ")||"none yet";
 let b;
 if(!r)b=`<div class="card"><b>Rest day</b><p class="muted">No workout planned for ${DN[S.sel]}. Rest is part of progress.</p><button class="btn" onclick="R[S.sel]={name:'New workout',ex:[]};S.edit=1;draw()">Add a workout for ${DN[S.sel]}</button></div>`;
 else if(E)b=`<input value="${esc(r.name)}" oninput="R[S.sel].name=this.value" aria-label="Workout name">`+r.ex.map((x,i)=>`<div class="ex"><input value="${esc(x.n)}" placeholder="Exercise" oninput="R[S.sel].ex[${i}].n=this.value"><input value="${esc(x.s)}" placeholder="3 × 10" oninput="R[S.sel].ex[${i}].s=this.value"><button class="x" aria-label="Remove exercise" onclick="R[S.sel].ex.splice(${i},1);draw()">✕</button></div>`).join("")+`<button class="btn o" onclick="R[S.sel].ex.push({n:'',s:'3 × 10'});draw()">＋ Add exercise</button><button class="btn o" style="margin-top:8px;color:var(--down)" onclick="R[S.sel]=null;draw()">Make ${DN[S.sel]} a rest day</button>`;
 else{const d=r.ex.filter(x=>x.d).length;b=`<h2>${esc(r.name)}</h2>`+(r.ex.map((x,i)=>`<div class="card row ${x.d?"on":""}" onclick="R[S.sel].ex[${i}].d^=1;draw()"><div class="chk">${x.d?"✓":""}</div><div style="flex:1"><div class="nm"><b>${esc(x.n)||"Unnamed exercise"}</b></div><div class="muted">${esc(x.s)}</div></div></div>`).join("")||'<p class="muted">No exercises yet. Tap Edit to add some.</p>')+`<div class="bar"><i style="width:${r.ex.length?d/r.ex.length*100:0}%"></i></div><p class="muted">${r.ex.length&&d==r.ex.length?"Workout complete. Nice work.":"Tap an exercise to check it off."}</p>`}
 return `<div class="row" style="justify-content:space-between"><h2 style="margin:6px 0">My routine</h2><button class="btn o" style="width:auto;padding:6px 16px" onclick="S.edit^=1;draw()">${E?"Done":"Edit"}</button></div>
 <div class="card row" style="justify-content:space-between"><span>Today</span><span class="muted">${tot?`Workouts ${w}/${tot}`:"Rest day"}</span></div>
 <div class="wk">${DN.map((d,i)=>`<button class="${i==S.sel?"sel":""}" onclick="S.sel=${i};draw()">${d}<i ${R[i]?"":"hidden"}></i></button>`).join("")}</div>
 ${b}
 ${S.note?`<div class="card" style="border-color:var(--gold);margin-top:12px">🔔 <b>Profitable Progress</b><div style="white-space:pre-line">${esc(S.note)}</div></div>`:""}
 <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>⏰ Workout reminder</span><input type="time" value="${S.rt}" style="width:auto;margin:0" oninput="S.rt=this.value"></div><div class="muted" style="margin:8px 0">You get a notification at this time on your workout days: ${days}.</div><button class="btn o" onclick="pv()">Preview notification</button></div>`}
const GL=[['lean','Lean'],['bulk','Bulk'],['maintain','Maintain']];
const AC=[['1.2','Mostly sitting'],['1.375','Light'],['1.55','Moderate'],['1.725','Very active']];
const EQ=[['bw','Bodyweight'],['db','Dumbbells'],['bb','Barbell'],['mc','Machines'],['bd','Bands'],['pu','Pull-up bar'],['kb','Kettlebell']];
const L={chest:[['Barbell Bench Press','bb'],['Dumbbell Bench Press','db'],['Machine Chest Press','mc'],['Push-ups','bw'],['Band Chest Press','bd']],
chest2:[['Incline Dumbbell Press','db'],['Pec Deck Machine','mc'],['Feet-elevated Push-ups','bw'],['Band Chest Fly','bd']],
shoulder:[['Barbell Overhead Press','bb'],['Dumbbell Shoulder Press','db'],['Machine Shoulder Press','mc'],['Pike Push-ups','bw'],['Band Shoulder Press','bd']],
tri:[['Triceps Pushdown','mc'],['Overhead Triceps Extension','db'],['Band Pushdown','bd'],['Bench Dips','bw']],
back:[['Barbell Row','bb'],['One-arm Dumbbell Row','db'],['Seated Cable Row','mc'],['Band Row','bd'],['Inverted Row (sturdy table)','bw']],
vert:[['Pull-ups','pu'],['Lat Pulldown','mc'],['Band Lat Pulldown','bd'],['Dumbbell Pullover','db'],['Superman Pulls','bw']],
bi:[['Barbell Curl','bb'],['Dumbbell Curl','db'],['Cable Curl','mc'],['Band Curl','bd'],['Chin-ups','pu']],
quad:[['Barbell Squat','bb'],['Leg Press','mc'],['Goblet Squat','db'],['Kettlebell Goblet Squat','kb'],['Bodyweight Squat','bw']],
hinge:[['Romanian Deadlift','bb'],['Dumbbell Romanian Deadlift','db'],['Kettlebell Swing','kb'],['Leg Curl Machine','mc'],['Band Pull-through','bd'],['Glute Bridge','bw']],
lunge:[['Dumbbell Walking Lunges','db'],['Reverse Lunges','bw']],
calf:[['Seated Calf Raise Machine','mc'],['Standing Calf Raise','bw']],
core:[['Hanging Knee Raise','pu'],['Plank','bw'],['Crunches','bw']]};
const T={FB:['quad','chest','back','hinge','shoulder','core'],UP:['chest','back','shoulder','vert','bi','tri'],LO:['quad','hinge','lunge','calf','core'],PU:['chest','chest2','shoulder','tri'],PL:['back','vert','bi','core']};
const SC={3:[[0,'Full body','FB',0],[2,'Full body','FB',1],[4,'Full body','FB',0]],4:[[0,'Upper body','UP',0],[1,'Lower body','LO',0],[3,'Upper body','UP',1],[4,'Lower body','LO',1]],5:[[0,'Push day','PU',0],[1,'Pull day','PL',0],[2,'Leg day','LO',0],[3,'Upper body','UP',1],[4,'Lower body','LO',1]]};
const cb=(items,on,f)=>`<div class="cb">${items.map(x=>`<button class="${on(x[0])?'sel':''}" onclick="${f(x[0])}">${x[1]}</button>`).join('')}</div>`;
window.sv=(k,v)=>{S[k]=v;draw()};window.sp=(k,v)=>{S.p[k]=v;draw()};
window.te=k=>{const i=S.eq.indexOf(k);i<0?S.eq.push(k):S.eq.splice(i,1);draw()};
window.addF=k=>{S.log.push({n:k,c:F[k]});S.lm=k+' added to today’s calories.';cam()};
window.ml=()=>{const n=$('#mn').value.trim()||'Food',c=+$('#mc').value;if(c>0)S.log.push({n,c:Math.round(c)});draw()};
window.blank=()=>{R.splice(0,7,...Array(7).fill(null));S.fs='w';S.sel=0;S.edit=0;S.pm='Blank week ready. Tap a day, then add your own workout.';draw()};
window.gen=()=>{
 const av=e=>e=='bw'||S.eq.includes(e),wkk=Array(7).fill(null);
 SC[S.dpw].forEach(([d,name,tp,off])=>{
  const ex=T[tp].map((c,i)=>{const a=L[c].filter(x=>av(x[1]));if(!a.length)return null;const x=a[off%a.length];
   const s=x[0]=='Plank'?'3 × 30-45 s':x[1]=='bw'?'3 × 10-20':S.goal=='bulk'?(i?'3 × 8-12':'4 × 6-8'):S.goal=='lean'?(i?'3 × 12-15':'3 × 10-12'):(i?'3 × 10-12':'3 × 8-10');
   return {n:x[0],s}}).filter(Boolean);
  if(S.goal=='lean')ex.push({n:'Cardio: brisk walk or bike',s:'15 min'});
  wkk[d]={name,ex}});
 R.splice(0,7,...wkk);S.fs='w';S.edit=0;S.sel=wkk.findIndex(Boolean);
 S.pm='Your plan is ready: '+S.dpw+' days a week, built for '+GL.find(x=>x[0]==S.goal)[1].toLowerCase()+'. Tap a day to view it, or Edit to change anything.';draw()};
function tgt(){const p=S.p,a=+p.age,h=(+p.ft)*12+(+p.inch||0),w=+p.lb;if(!(a>0&&h>0&&w>0))return null;
 const m=Math.round((10*w*.45359+6.25*h*2.54-5*a+({M:5,F:-161,O:-78}[p.sex]))*(+p.act)/10)*10,fl={M:1500,F:1200,O:1350}[p.sex];let c=m,note='';
 if(S.goal=='lean'){if(a<18){note='Under 18: your body is still growing, so this stays at maintenance. Talk with a doctor before cutting calories.'}else{const lb=w,gw=+S.gw,wk=+S.wk;let d=500,tw=0;if(gw>0&&gw<lb&&wk>0){d=(lb-gw)*3500/(wk*7);tw=1}
  const d2=Math.min(d,1000);c=Math.max(m-d2,fl);if(m-d2<fl)note='Held at a safe minimum so you still get enough fuel.';
  if(tw){const u=m-c;if(u>0){const w2=Math.ceil((lb-gw)*3500/(u*7));note=(note?note+' ':'')+(d>u+10?'That timeframe is faster than is safe. At a safe pace you would reach '+gw+' lb in about '+w2+' weeks.':'On pace: about '+Math.round(u)+' cal/day deficit to lose '+Math.round((lb-gw)*10)/10+' lb in '+wk+' weeks.')}}}}
 if(S.goal=='bulk')c=m+300;
 return{m,c:Math.round(c/10)*10,pr:Math.round(w*.8),note}}
function plan(){return `<div class="card"><b>✨ Create my plan</b><p class="muted">Pick your equipment, goal and days. We build your whole week.</p>
<div class="muted">Equipment you have</div>${cb(EQ,k=>k=='bw'||S.eq.includes(k),k=>`te('${k}')`)}
<div class="muted">Goal</div>${cb(GL,k=>S.goal==k,k=>`sv('goal','${k}')`)}
<div class="muted">Days per week</div>${cb([['3','3 days'],['4','4 days'],['5','5 days']],k=>S.dpw==k,k=>`sv('dpw','${k}')`)}
<button class="btn" onclick="gen()">Generate my plan</button></div>
<div class="card"><b>🛠️ Build my own</b><p class="muted">Start with an empty week and add your own workouts and exercises.</p><button class="btn o" onclick="blank()">Start from scratch</button></div>`}
function cal(){
 const p=S.p,t=tgt(),e=S.log.reduce((a,x)=>a+x.c,0);
 let h=`<div class="card"><b>Your numbers</b><div class="g4"><input type="number" inputmode="numeric" placeholder="Age" aria-label="Age" value="${esc(p.age)}" oninput="S.p.age=this.value"><input type="number" inputmode="numeric" placeholder="ft" aria-label="Height feet" value="${esc(p.ft)}" oninput="S.p.ft=this.value"><input type="number" inputmode="numeric" placeholder="in" aria-label="Height inches" value="${esc(p.inch)}" oninput="S.p.inch=this.value"><input type="number" inputmode="numeric" placeholder="lb" aria-label="Weight in pounds" value="${esc(p.lb)}" oninput="S.p.lb=this.value"></div><div class="muted">Age · Height (ft, in) · Weight (lb)</div>
<div class="muted" style="margin-top:8px">Goal weight (lb)</div><input type="number" inputmode="numeric" placeholder="Goal weight" aria-label="Goal weight in pounds" value="${esc(S.gw)}" oninput="S.gw=this.value">
<div class="muted" style="margin-top:8px">Gender (used in the calorie formula)</div>${cb([['M','Male'],['F','Female'],['O','Other']],k=>p.sex==k,k=>`sp('sex','${k}')`)}
<div class="muted">Activity</div>${cb(AC,k=>p.act==k,k=>`sp('act','${k}')`)}
<div class="muted">Goal</div>${cb(GL,k=>S.goal==k,k=>`sv('goal','${k}')`)}${S.goal=='lean'?`<div class="muted" style="margin-top:8px">How long do you want to take? (needs a goal weight above)</div>${cb([['3','3 weeks'],['4','4 weeks'],['8','2 months'],['12','3 months']],k=>S.wk==k,k=>`sv('wk','${k}')`)}<input type="number" inputmode="numeric" placeholder="Or type the number of weeks" aria-label="Weeks" value="${esc(S.wk)}" oninput="S.wk=this.value">`:''}
<button class="btn" onclick="draw()">Calculate</button></div>`;
 if(t)h+=`<div class="card"><div class="muted">Daily calorie target (${GL.find(x=>x[0]==S.goal)[1]})</div><div style="font-size:32px;font-weight:800;color:var(--gold)">${t.c} cal</div><div class="muted">Maintenance ≈ ${t.m} cal · Protein goal ≈ ${t.pr} g</div>${t.note?`<p class="muted">${t.note}</p>`:''}<div class="muted">Estimate only, not medical advice.</div></div>`;
 const left=t?t.c-e:0;

 else if(x.k=='ml'){vis=`<style>@keyframes mz{0%,100%{transform:scale(.7)}50%{transform:scale(1)}}.bc{animation:mz 8s ease-in-out infinite;transform-origin:60px 60px}@media(prefers-reduced-motion:reduce){.bc{animation:none}}</style><svg viewBox="0 0 120 120" role="img" aria-label="Calm glowing circle"><circle class="bc" cx="60" cy="60" r="50" style="fill:var(--gold);opacity:.6"/><circle class="bc" cx="60" cy="60" r="28" style="fill:var(--gold)"/></svg>`;
  desc='A guided mindfulness practice. Find a comfortable position, close your eyes, and let the prompt guide your attention for about 3 minutes.';

 <div class="card" style="max-width:260px;margin:12px auto">${vis}</div>

const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const okd=k=>{const v=S.pd[k];return !!(v&&(v.a||v.b))};

function stk(){let n=0,i=okd(dk())?0:1;while(okd(dk(dAgo(i)))){n++;i++}
 const ks=Object.keys(S.pd).filter(okd).sort();let best=0,run=0,prev=null;
 ks.forEach(k=>{const t=new Date(k+'T00:00:00');run=prev&&Math.round((t-prev)/864e5)==1?run+1:1;prev=t;best=Math.max(best,run)});
 const dots=[6,5,4,3,2,1,0].map(j=>{const d=dAgo(j),on=okd(dk(d));return `<div style="text-align:center;font-size:12px"><div style="width:28px;height:28px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;${on?'background:var(--gold);color:#000;font-weight:700':'border:2px solid var(--line)'}">${on?'✓':''}</div>${DN[(d.getDay()+6)%7]}</div>`}).join('');
 return `<div class="card"><div class="row" style="justify-content:space-between"><b>🔥 ${n}-day streak</b><span class="muted">Best ${best} · Total ${ks.length} days</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px">${dots}</div><div class="muted" style="margin-top:10px">${okd(dk())?'You did it today. Nice work.':'Finish a morning or night routine today to keep your streak going.'}</div></div>`}
function psyT(){$('#screen').innerHTML=S.dt?det():'<h2>Psyche</h2>'+psy();if($('#lib'))lib()}
function gbar(){const cur=+S.p.lb,g=+S.gw;
 if(!(g>0&&cur>0))return `<div class="card row" style="justify-content:space-between" onclick="S.fs='c';draw()"><span>🎯 Set your goal weight</span><span class="muted">Calories ›</span></div>`;
 const s=+S.sw||cur,done=s==g?1:Math.max(0,Math.min(1,(cur-s)/(g-s))),hit=(g>=s&&cur>=g)||(g<=s&&cur<=g);
 return `<div class="card" onclick="goGw()"><div class="row" style="justify-content:space-between"><span>🎯 Goal <b>${g} lb</b></span><span class="muted">Now ${cur} lb · ${hit?'Goal reached!':Math.abs(cur-g).toFixed(1)+' lb to go'}</span></div><div class="bar"><i style="width:${done*100}%"></i></div></div>`}

 const l=t.c-e;
 return `<div class="card" onclick="goCal()"><div class="row" style="justify-content:space-between"><span><b>${e}</b> eaten</span><span class="muted">${l>=0?l+' left':-l+' over'} · goal ${t.c}</span></div><div class="bar"><i style="width:${Math.min(100,e/t.c*100)}%;${l<0?'background:var(--down)':''}"></i></div></div>`}
function fit(){const t=[['w','Workouts'],['c','Calories'],['p','Plan']];
 $('#screen').innerHTML=`<div class="seg">${t.map(x=>`<button class="${S.fs==x[0]?'sel':''}" onclick="S.fs='${x[0]}';S.pm='';draw()">${x[1]}</button>`).join('')}</div>`+(S.fs=='w'?gbar()+cbar():'')+(S.pm&&S.fs=='w'?`<div class="card" style="border-color:var(--gold)">${esc(S.pm)}</div>`:'')+({w:wk,c:cal,p:plan}[S.fs])()}

const CT=[['All',0],['Fruit',/Apple|Banana|Orange|Strawberr|Blueberr|Grapes|Watermelon|Pineapple|Mango|Peach|Pear|Raisins|Avocado|Cherr|Kiwi|Melon/],['Veggies',/Broccoli|Carrots|Spinach|potato|Corn|Green beans|salad|Cucumber|Pepper|Onion|Tomato/i],['Protein',/Egg|Chicken (breast|thigh)|beef|steak|Salmon|Tuna|Shrimp|Pork|Bacon|Turkey|Tofu|Protein/],['Grains',/rice|Oatmeal|Pasta|Bread|Bagel|tortilla|Cereal|Pancakes|Waffle|Quinoa|Granola/],['Dairy',/yogurt|Milk|cheese|Cheddar|Mozzarella|Cottage|Butter|Ice cream/],['Fast food',/burger|fries|nuggets|Hot dog|burrito|Taco|Sub sandwich|Mac and|Fried chicken|Sushi|Ramen|Lasagna|Pizza|Wings|Fish sandwich/],['Snacks',/chips|Popcorn|Peanut|Almonds|Trail|Cookie|Brownie|Donut|Chocolate bar|Crackers|Pretzels|Hummus|Cashews|Candy|Cake/],['Drinks',/^Water|coffee|Latte|juice|Soda|Beer|Wine|drink|Smoothie|Chocolate milk|Tea/]];

 const q=S.food.toLowerCase(),fc=S.fc||'All',cr=(CT.find(c=>c[0]==fc)||[])[1];
 const r=Object.keys(F).filter(k=>k.toLowerCase().includes(q)&&(!cr||cr.test(k))).slice(0,(q||cr)?60:10);
 const sc=S.sc?`<div class="card" style="border-color:var(--gold)"><b>${esc(S.sc.n)}</b><div class="muted">${esc(S.sc.u)}: ${S.sc.c} cal</div><div class="row" style="justify-content:center;gap:14px;margin:8px 0"><button class="btn" style="width:auto;padding:6px 16px" onclick="qs(-.5)">−</button><b style="color:var(--gold)">${S.sc.q} × = ${Math.round(S.sc.c*S.sc.q)} cal</b><button class="btn" style="width:auto;padding:6px 16px" onclick="qs(.5)">＋</button></div><button class="btn" onclick="addS()">＋ Add to today</button></div>`:'';
 $("#screen").innerHTML=`<h2>Scan food</h2>
 <div class="vf"><b></b><b></b><b></b><b></b></div>
 <button class="btn" onclick="scan()">Scan barcode</button>${S.lm?`<div class="card" style="border-color:var(--gold)">${esc(S.lm)}</div>`:''}${sc}
 <div class="ex" style="margin-top:10px"><input id="bc" inputmode="numeric" placeholder="Or type the barcode number"><button class="btn" style="width:auto;padding:10px 14px" onclick="look($('#bc').value)">Look up</button></div>
 <p class="muted">Or pick a category or type a food:</p>${cb(CT.map(c=>[c[0],c[0]]),k=>fc==k,k=>`S.fc='${k}';cam()`)}
 <input id="fi" placeholder="Search a food, like banana" value="${S.food}" oninput="S.food=this.value;cam();$('#fi').focus();$('#fi').setSelectionRange(99,99)">
 ${r.map(k=>`<div class="card row" style="justify-content:space-between"><div><b>${k}</b><div style="color:var(--gold);font-weight:700">${F[k]} cal</div></div><button class="btn" style="width:auto;padding:8px 14px" onclick="addF('${k}')">＋ Add</button></div>`).join("")||'<p class="muted">No match. Add it by hand on the Fitness > Calories screen.</p>'}
 <p class="muted">${(q||cr?'':'Showing 10 popular foods. Pick a category or type to search. ')+'Calories are estimates.'}</p>`}
const CP=n=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins[n];
let _inst=0;
window.scan=async()=>{
 const P=CP('BarcodeScanner');
 if(!P){msg('The barcode scanner works in the installed Android app. Type the barcode number or a food instead.');return}
 try{
  msg('Opening the scanner…');
  let r;
  try{r=await P.scan()}catch(e){
   const m=String(e&&e.message||e);
   if(/cancel/i.test(m)){msg('');return}
   if(/module|install|available/i.test(m)){
    msg('Downloading the scanner (one time, needs internet). It will open by itself when ready.');
    if(!_inst){_inst=1;try{await P.addListener('googleBarcodeScannerModuleInstallProgress',x=>{if(x.state===4){_inst=0;scan()}else if(x.state===5){_inst=0;msg('The scanner download failed. Check your internet and tap Scan again, or type the barcode number.')}})}catch(_){}}
    await P.installGoogleBarcodeScannerModule();return}
   throw e}
  if(!r||!r.barcodes||!r.barcodes.length){msg('No barcode was read. Try again, or type the number under the barcode.');return}
  await look(r.barcodes[0].rawValue)
 }catch(e){msg('Scanner problem: '+String(e&&e.message||e)+'. You can type the barcode number below.')}
};
window.look=async code=>{
 code=String(code||'').replace(/\D/g,'');
 if(code.length<6){msg('Type the full number printed under the barcode.');return}
 msg('Looking up '+code+'…');
 try{
  const ids=[code];if(code.length==12)ids.push('0'+code);
  let p=null;
  for(const id of ids){
   const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
   const res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+id+'.json?fields=product_name,brands,nutriments,serving_size,serving_quantity',{signal:ctl.signal});clearTimeout(t);
   const j=await res.json();if(j.status===1&&j.product){p=j.product;break}}
  if(!p){S.sc=null;msg('Barcode '+code+' is not in the food database. Type the food below or add the calories by hand.');return}
  const n=p.nutriments||{};let c=+n['energy-kcal_serving'],u='per serving'+(p.serving_size?' ('+p.serving_size+')':'');
  if(!(c>0)&&+n['energy-kcal_100g']>0){const sq=+p.serving_quantity;if(sq>0){c=n['energy-kcal_100g']*sq/100;u='per serving ('+(p.serving_size||sq+' g')+')'}else{c=+n['energy-kcal_100g'];u='per 100 g'}}
  if(!(c>0)){S.sc=null;msg('No calorie info for this product. Type it in instead.');return}
  S.sc={n:((p.brands?p.brands.split(',')[0].trim()+' ':'')+(p.product_name||'Scanned food')),c:Math.round(c),u,q:1};msg('Found it! Pick how many servings, then add.')
 }catch(e){msg('Could not look that up. Check your internet connection and try again.')}
};

/* Real notifications and alarms (installed app only) */
async function sched(){
 const N=CP('LocalNotifications');if(!N)return;
 try{
  let p=await N.checkPermissions();
  if(p.display!=='granted'){p=await N.requestPermissions();if(p.display!=='granted')return}
  const pend=await N.getPending();
  if(pend.notifications.length)await N.cancel({notifications:pend.notifications.map(x=>({id:x.id}))});
  const hm=t=>{const a=String(t||'07:00').split(':');return{hour:+a[0]||0,minute:+a[1]||0}},out=[];
  R.forEach((r,i)=>{if(!r)return;const wd=((i+1)%7)+1;
   out.push({id:10+wd,title:'Time for '+r.name+'!',body:r.ex.map(x=>x.n+' '+x.s).join(', ')||'Open Profitable Progress to start.',schedule:{on:Object.assign({weekday:wd},hm(S.rt)),allowWhileIdle:true}})});
  if(S.ps&&S.aon&&S.am)out.push({id:1,title:'Good morning ☀️',body:'Your '+S.am+'-minute morning routine is ready.',schedule:{on:hm(S.at),allowWhileIdle:true}});
  if(S.ps&&S.bon&&S.pm)out.push({id:2,title:'Time to wind down 🌙',body:'Your '+S.pm+'-minute night routine starts now, then lights out.',schedule:{on:hm(S.bt),allowWhileIdle:true}});
  if(out.length)await N.schedule({notifications:out});
 }catch(e){}
}
